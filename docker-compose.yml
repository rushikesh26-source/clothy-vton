version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clothy_postgres
    restart: always
    environment:
      POSTGRES_USER: clothy_admin
      POSTGRES_PASSWORD: clothy_secret_password
      POSTGRES_DB: clothy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothy_admin -d clothy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clothy_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: