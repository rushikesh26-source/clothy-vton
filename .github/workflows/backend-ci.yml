name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "database/**"
      - "packages/**"
      - "package*.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "database/**"
      - "packages/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clothy_admin
          POSTGRES_PASSWORD: clothy_secret_password
          POSTGRES_DB: clothy_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clothy_admin -d clothy_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clothy_admin:clothy_secret_password@localhost:5432/clothy_test_db
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --if-present

      - name: Run Backend Tests
        run: npm run test --workspace=apps/api --if-present